{% extends "manage/base.html" %}{% block body %}
<h1>{% if obj %}Modifier{% else %}Ajouter{% endif %} — {{ cfg.label }}</h1>
<form method="post" enctype="multipart/form-data" class="panel formp">{% csrf_token %}{% for f in form %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}{{ f.errors }}{% endfor %}
<div style="margin-top:18px"><button class="btn-d">Enregistrer</button> <a class="btn-d ghost" href="{% url 'manage:list' key %}">Annuler</a></div></form>{% endblock %}
